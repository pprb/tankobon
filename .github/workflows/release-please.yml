name: Release

# Keeps a release pull request open on master: version bump in package.json + CHANGELOG.md, built
# from the Conventional Commits merged since the last release. Merging it tags the release and
# creates the GitHub release. Requires Settings > Actions > General > "Allow GitHub Actions to
# create and approve pull requests".
on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
